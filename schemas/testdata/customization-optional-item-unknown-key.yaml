# NEGATIVE: unknown field inside an env_keys item (additionalProperties:false
# at the item level). `restart_required` was considered and deliberately NOT
# built: every key in this class resolves at pod start, so the field would have
# exactly one valid value.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  env: fixture-runtime-config
provided_selectors: {}
required:
  env_keys:
    - MANDATORY_ENDPOINT
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  env_keys:
    - name: REPLICATION_FACTOR
      description: Drives ingester.ring.replication_factor.
      default: "1"
      restart_required: true
sync_wave: "10"
external_dependencies: []
