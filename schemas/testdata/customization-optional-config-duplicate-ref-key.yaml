# SEMANTIC NEGATIVE (S4): two entries share the (ref, key) identity
# fixture-config|rules.yaml while declaring different paths and different
# defaults. Schema-valid — they are distinct array items, so `uniqueItems` does
# not see it — so this fixture must PASS check-jsonschema and FAIL the semantic
# check: nothing decides which default holds for that one file.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
    - path: /etc/fixture/other/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: The same file, described differently.
      default: |
        rules:
          - allow-all
sync_wave: "10"
external_dependencies: []
