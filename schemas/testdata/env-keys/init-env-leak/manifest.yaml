apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  config.yaml: |
    ring:
      replication_factor: ${REPLICATION_FACTOR:-1}
    storage:
      endpoint: ${OBJECT_STORE_ENDPOINT}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-defaults
data:
  LOG_FORMAT: json
---
apiVersion: v1
kind: Secret
metadata:
  name: app-bootstrap
stringData:
  bootstrap-token: placeholder-not-a-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        - name: init
          image: example.invalid/init:1.0.0
          env:
            - name: INIT_MODE
              value: fast
            - name: REPLICATION_FACTOR
              value: "1"
      containers:
        - name: app
          image: example.invalid/app:1.0.0
          args:
            - -config.file=/etc/app/config.yaml
            - -config.expand-env=true
          env:
            - name: LOG_LEVEL
              value: info
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-runtime-config
                  key: OBJECT_STORE_ENDPOINT
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-runtime-secret
                  key: ADMIN_PASSWORD
            - name: EXTERNAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-runtime-config
                  key: OBJECT_STORE_ENDPOINT
                  optional: true
          envFrom:
            - configMapRef:
                name: app-defaults
            - secretRef:
                name: app-bootstrap
            - configMapRef:
                name: app-runtime-config
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/app
      volumes:
        - name: config
          configMap:
            name: app-config
