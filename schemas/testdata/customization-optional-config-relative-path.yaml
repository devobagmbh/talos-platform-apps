# NEGATIVE: `path` is relative. The field is the ABSOLUTE path of the file the
# workload reads; a relative path cannot identify a mount, and a trailing slash
# (a bare mountPath) is rejected by the same pattern.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: etc/fixture/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
sync_wave: "10"
external_dependencies: []
