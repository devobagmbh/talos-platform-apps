# NEGATIVE: `path` carries a non-canonical `.` segment. The string names the same
# file as /etc/fixture/rules.yaml, but S5's uniqueness check compares raw strings,
# so without this pattern two entries could alias one mount point and both pass.
# Binds the `(?!.*/\.\.?(/|$))` lookahead specifically — the `relative-path`
# fixture next to it binds only the leading-slash half of the same pattern.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/./rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
sync_wave: "10"
external_dependencies: []
