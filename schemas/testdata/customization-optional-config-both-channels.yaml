# SEMANTIC NEGATIVE (S3): the (ref, key) identity fixture-config|rules.yaml is
# declared in BOTH required.config_files and optional.config_files. Schema-valid,
# so this fixture must PASS check-jsonschema and FAIL the semantic check: a file
# either ships with working baked content or the consumer must author it, and the
# consumer cannot tell whether supplying nothing is legal.
# The two entries declare DIFFERENT paths on purpose — an identical path would also
# trip S5 (union path uniqueness) and the fixture would stop isolating S3.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files:
    - path: /etc/fixture/rules.yaml
      ref: fixture-config
      key: rules.yaml
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/optional/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
sync_wave: "10"
external_dependencies: []
