# NEGATIVE: `key` violates the ConfigMap data-key charset ([-._a-zA-Z0-9]+).
# Same identity-collision reasoning as the bad-ref fixture: a key containing `|`
# would make "<ref>|<key>" ambiguous.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/rules.yaml
      ref: fixture-config
      key: rules|yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
sync_wave: "10"
external_dependencies: []
