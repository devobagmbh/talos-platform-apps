# SEMANTIC NEGATIVE (S6): an optional.config_files entry names the Secret ref.
# Schema-valid — `ref` is a plain string and JSON Schema cannot know the object's
# kind. The composition is what makes it a defect: optional.config_files declares
# content the ARTIFACT BAKES, and `default` records that content VERBATIM, so a
# Secret ref instructs the author to commit usable secret material to this
# repository (AGENTS.md §Hard Constraints, "No real secrets in the repo — not even
# in tests"). gitleaks is an entropy/pattern scanner and would not flag a baked
# htpasswd, TLS or OIDC client config. A consumer-authored secret file is a
# required.secret_keys / required.config_files concern instead.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  # Both refs deliberately name the same object: that is the only shape in which S6
  # is the rule that fires. S7 (ref must equal provided_refs.config) already catches
  # a Secret named under a DIFFERENT ref, so isolating S6 requires the author to have
  # affirmatively declared the Secret as the config ref — the deliberate-evasion case.
  config: fixture-runtime-secret
  secret: fixture-runtime-secret
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/credentials.yaml
      ref: fixture-runtime-secret
      key: credentials.yaml
      description: Credentials the workload presents upstream.
      default: |
        username: fixture
        password: ""
sync_wave: "10"
external_dependencies: []
