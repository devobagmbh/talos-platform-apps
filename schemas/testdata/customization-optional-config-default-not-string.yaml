# NEGATIVE: `default` is a mapping, not a string. The field is deliberately typed
# as a string so the contract records the baked content VERBATIM, rather than a
# re-encoded copy a reader would have to serialise back to compare against the
# artifact. There is no prose escape hatch for large content (DR-0005): a summary
# would not be diffable against the render, which is the whole point of the field.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default:
        rules: []
sync_wave: "10"
external_dependencies: []
