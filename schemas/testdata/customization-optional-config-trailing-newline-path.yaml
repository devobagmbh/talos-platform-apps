# NEGATIVE: `path` carries a trailing newline (double-quoted YAML scalar), and is
# rejected by the anchored `pattern`. It also serves as a REGEX-VARIANT CANARY.
# check-jsonschema 0.37.2 evaluates `pattern` with ECMAScript semantics (via regress)
# by default, where `$` anchors only at end-of-input. Under `--regex-variant python`
# — or if a future release changed the default — `$` would also match immediately
# before a single trailing newline and this value would be ACCEPTED. That matters
# beyond tidiness: the value is a DIFFERENT string from the same path without the
# newline, so two entries naming one file would not collide in S5's group_by and the
# duplicate would pass green. If this fixture ever flips to "NEGATIVE FIXTURE
# PASSED", the regex dialect changed under the gate — pin the variant rather than
# widening the pattern.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: "/etc/fixture/rules.yaml\n"
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
sync_wave: "10"
external_dependencies: []
