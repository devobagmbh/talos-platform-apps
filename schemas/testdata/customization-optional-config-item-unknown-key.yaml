# NEGATIVE: unknown field inside a config_files item (additionalProperties:false
# at the item level). `reload` is used here rather than `restart_required`: for a
# mounted file the reload question is real and per-workload, and DR-0005 routes
# the answer into `description` as prose instead of a boolean — so the rejection
# this fixture binds is the closed item shape, not a judgement on that field name.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs:
  config: fixture-config
provided_selectors: {}
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
optional:
  config_files:
    - path: /etc/fixture/rules.yaml
      ref: fixture-config
      key: rules.yaml
      description: Rule set the workload evaluates.
      default: |
        rules: []
      reload: automatic
sync_wave: "10"
external_dependencies: []
