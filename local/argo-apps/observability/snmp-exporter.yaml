# Argo Application for observability/snmp-exporter (local test environment).
# The render carries metadata.namespace on every namespaced object, so the
# destination namespace must be the shipped `snmp-exporter`. The workload needs
# the consumer Secret `snmp-exporter-auth` (key `auths.yml`); without it the pod
# stays in ContainerCreating.
# Template placeholders (envsubst via task local:apply / local:dev):
#   ${TAG}       — chart version (e.g. 0.0.0-dev or 0.0.0-dev.<epoch>)
#   ${REGISTRY}  — kind-registry.registry.svc.cluster.local:5000/talos-platform-apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-snmp-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform.devoba.de/local-test: "true"
    platform.devoba.de/sub-layer: observability
    platform.devoba.de/component: snmp-exporter
spec:
  project: default
  source:
    repoURL: oci://${REGISTRY}/observability/snmp-exporter
    targetRevision: ${TAG}
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: snmp-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
