# Local memcached fixture for the mimir query-path cache tests.
#
# The catalog ships NO memcached: the component's four *-cache chart subcharts stay
# disabled, and the cache blocks name an address the CONSUMER supplies. Without this
# fixture the "cache actually serves hits" test is unexecutable locally, so it lives
# here rather than in the artifact.
#
# IDLE UNTIL #794: the current mimir artifact renders no cache configuration at all, so
# nothing points at this Service yet. It is deployed ahead of the component change so the
# cache tests have a target the moment the switchable cache blocks land.
#
# Image tag matches the one the mimir-distributed 5.8.0 chart pins for its own
# memcached subcharts, so the local fixture and the upstream default do not drift.
#
# ACCEPTED CVE RISK, deliberate. This Alpine-based tag carries fixable HIGH/CRITICAL
# CVEs (openssl, c-ares), which the advisory diff-scoped trivy-cve PR check reports.
# That check is not a required gate by design. Bumping the tag would clear them and
# break the property this pin exists for -- the fixture would then test against a
# memcached the chart does not ship, which is the drift the comment above guards. The
# risk is bounded: this manifest lives under local/fixtures/, is applied only to the
# local Talos test cluster, is never packaged into an OCI artifact and never reaches a
# consumer. It follows the chart's pin, so it improves when upstream bumps.
#
# The mimir namespace enforces Pod Security `restricted`, so the pod carries the full
# restricted set (runAsNonRoot, no privilege escalation, all capabilities dropped,
# RuntimeDefault seccomp). memcached 11 is the image's own unprivileged uid.
#
# max-item-size (-I) is raised to 5m because mimir's index and results caches default
# to a 5 MiB max_item_size; leaving memcached at its 1 MiB default would make those
# two caches silently drop every larger item.
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: mimir
  labels:
    app.kubernetes.io/name: memcached
    platform.devoba.de/local-test: "true"
spec:
  clusterIP: None
  ports:
    - name: memcached
      port: 11211
      targetPort: memcached
  selector:
    app.kubernetes.io/name: memcached
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memcached
  namespace: mimir
  labels:
    app.kubernetes.io/name: memcached
    platform.devoba.de/local-test: "true"
spec:
  serviceName: memcached
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 11
        runAsGroup: 11
        fsGroup: 11
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached
          image: memcached:1.6.38-alpine
          args: ["-m", "256", "-I", "5m", "-v"]
          ports:
            - name: memcached
              containerPort: 11211
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 320Mi
