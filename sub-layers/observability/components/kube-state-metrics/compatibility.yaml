# Empty: the exporter needs nothing from the catalog. Its one dependency is cluster-wide
# read on the control-plane API, which is a substrate precondition, not a component edge
# or a capability (ADR-0009).
requires: {}
provides:
  - name: kube-state-metrics
    version:
      sot: app
      app: 2.20.0   # real kube-state-metrics app (apis[] held chart 8.4.2)
      chart: 8.4.2
    api_surface: []
    # Empty by design, not deferred: the kube_* series over a Prometheus /metrics
    # endpoint has no drop-in alternative, so there is nothing swappable to declare.
    capabilities: []
