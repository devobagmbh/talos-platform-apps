metadata:
  chart: kube-state-metrics
  repo: https://prometheus-community.github.io/helm-charts
  version: 8.6.0 # bare SemVer — NO leading 'v' (--version v8.6.0 fails to resolve)
  # The chart's appVersion 2.20.0 is what selects the image
  # registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0 — there is no image
  # key in this file. Never override the tag here and never :latest.
  namespace: kube-state-metrics

values:
  # Pinned at the chart default so a chart bump flipping it cannot add a sidecar
  # container to the signed render.
  kubeRBACProxy:
    enabled: false

  # Enabled with an empty spec so the ConfigMap, volume, volumeMount and
  # `--custom-resource-state-config-file` flag all reach the signed Kustomize base: a
  # consumer patch can change objects that exist but cannot conjure ones that were
  # never rendered. `spec.resources: []` emits no `kube_customresource_*` series and
  # leaves the built-in collectors untouched.
  #
  # No rule set is baked for the platform's own CRDs: it would need RBAC for CRD
  # groups a cluster may not have, plus a pin against upstream CR-schema drift.
  #
  # `name` is pinned rather than derived from the release name because it is the
  # patch target `customization.yaml` declares. `create` and `key` repeat chart
  # defaults for the same reason — `key` is half the contract entry's (ref, key)
  # identity — so `task lint:values-keys` reporting them as NO-EFFECT is expected.
  #
  # `rbac.extraRules` stays at its `[]` default: read access to a consumer's CR
  # apiGroups is consumer-owned and per-apiGroup, never `apiGroups: ["*"]`.
  #
  # `config` is duplicated as `optional.config_files[].default` in
  # `customization.yaml`, which the consumer reads to know what it replaces. Nothing
  # gates the two against each other yet (the config-file arm of #802), so edit BOTH
  # or neither.
  customResourceState:
    enabled: true
    create: true
    name: kube-state-metrics-customresourcestate-config
    key: config.yaml
    config:
      spec:
        resources: []

  # Pod-scope pins for `pod-security.kubernetes.io/enforce: restricted`. The chart key
  # is `securityContext` with an `enabled` gate, NOT `podSecurityContext`. Its defaults
  # already satisfy restricted; pinned so a chart bump cannot weaken them silently.
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  # Container-scope pins for the same enforce level. `runAsNonRoot` and `runAsUser` are
  # NOT chart defaults at container scope — without them the container satisfies
  # restricted only by inheriting from the pod.
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop:
        - ALL

  # No `replicas:` key on purpose: replica count is cluster-specific, so the catalog
  # leaves it at the chart default of 1 for the consumer to override.
