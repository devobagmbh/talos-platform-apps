# The chart ships no Namespace, so this manifest is concatenated into the render. A
# shipped Namespace object takes precedence over Argo `managedNamespaceMetadata`, which
# is what makes the PSA posture below authoritative rather than advisory (ADR-0032).
#
# enforce: restricted — a stateless exporter with no host access, and the helm values
# pin the pod and container securityContexts to satisfy that level. Relaxing it here
# would silently un-anchor those pins.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-state-metrics
  labels:
    pod-security.kubernetes.io/enforce: restricted
    platform.devoba.de/sub-layer: observability
    platform.devoba.de/component: kube-state-metrics
