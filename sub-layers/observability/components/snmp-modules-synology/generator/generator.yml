# walk, lookups and the overrides before "Pack additions" are the upstream v0.30.1 synology section, unchanged.
# An auths: key in this file is written into the output and breaks the pack contract (README).
modules:
  synology:
    walk:
      - SYNOLOGY-SYSTEM-MIB::synoSystem         # 1.3.6.1.4.1.6574.1
      - SYNOLOGY-DISK-MIB::synoDisk             # 1.3.6.1.4.1.6574.2
      - SYNOLOGY-RAID-MIB::synoRaid             # 1.3.6.1.4.1.6574.3
      - SYNOLOGY-UPS-MIB::synoUPS               # 1.3.6.1.4.1.6574.4
      - SYNOLOGY-SMART-MIB::synologyDiskSMART   # 1.3.6.1.4.1.6574.5
      - SYNOLOGY-SERVICES-MIB::synologyService  # 1.3.6.1.4.1.6574.6
      - SYNOLOGY-STORAGEIO-MIB::storageIO       # 1.3.6.1.4.1.6574.101
      - SYNOLOGY-SPACEIO-MIB::spaceIO           # 1.3.6.1.4.1.6574.102
      - SYNOLOGY-ISCSILUN-MIB::synologyiSCSILUN # 1.3.6.1.4.1.6574.104
    lookups:
      - source_indexes: [spaceIOIndex]
        lookup: spaceIODevice
        drop_source_indexes: true
      - source_indexes: [storageIOIndex]
        lookup: storageIODevice
        drop_source_indexes: true
      - source_indexes: [serviceInfoIndex]
        lookup: serviceName
        drop_source_indexes: true
      - source_indexes: [diskIndex]
        lookup: diskID
        drop_source_indexes: true
      - source_indexes: [raidIndex]
        lookup: raidName
        drop_source_indexes: true
    overrides:
      SYNOLOGY-DISK-MIB::diskModel:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskType:
        type: DisplayString
      SYNOLOGY-RAID-MIB::raidFreeSize:
        type: gauge
      SYNOLOGY-RAID-MIB::raidName:
        type: DisplayString
      SYNOLOGY-RAID-MIB::raidTotalSize:
        type: gauge
      SYNOLOGY-SERVICES-MIB::serviceName:
        type: DisplayString
      SYNOLOGY-SMART-MIB::diskSMARTAttrName:
        type: DisplayString
      SYNOLOGY-SMART-MIB::diskSMARTAttrStatus:
        type: DisplayString
      SYNOLOGY-SMART-MIB::diskSMARTInfoDevName:
        type: DisplayString
      SYNOLOGY-SYSTEM-MIB::modelName:
        type: DisplayString
      SYNOLOGY-SYSTEM-MIB::serialNumber:
        type: DisplayString
      SYNOLOGY-SYSTEM-MIB::version:
        type: DisplayString
      # Pack additions: these OctetString objects would render as hex instead of text.
      SYNOLOGY-DISK-MIB::diskID:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskName:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskRole:
        type: DisplayString
      SYNOLOGY-ISCSILUN-MIB::iSCSILUNName:
        type: DisplayString
      SYNOLOGY-ISCSILUN-MIB::iSCSILUNType:
        type: DisplayString
      SYNOLOGY-ISCSILUN-MIB::iSCSILUNUUID:
        type: DisplayString
      # name and scale overrides match the bare object name only; a qualified key is a silent no-op.
      systemStatus:
        name: synology_system_status
      temperature:
        name: synology_temperature
      powerStatus:
        name: synology_power_status
      systemFanStatus:
