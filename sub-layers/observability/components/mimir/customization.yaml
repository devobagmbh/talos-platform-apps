# Customization Contract v2 (ADR-0024). The Grafana Mimir workload (the classic
# microservices Deployments/StatefulSets + Services + RBAC + the chart-generated mimir
# config ConfigMap + the dedicated Namespace) is the signed, pre-rendered artifact.
# Mimir is NOT cluster-agnostic: its S3 connection (endpoint, region, bucket names,
# credentials) is per-cluster and 100% consumer-owned. The freeze-line keeps that
# connection OUT of the frozen workload: the rendered Mimir config references ${VAR}
# placeholders, and Mimir resolves them at runtime from consumer-supplied env via the
# `-config.expand-env=true` flag (verified rendered into every component container's
# args — chart 5.8.0, present in the default args, NOT added via extraArgs).
#
# Shapes (a) + (c): the non-secret connection scalars come from a ConfigMap via envFrom
# (Shape a), the credentials from a Secret via envFrom (Shape c). Both are wired onto
# EVERY component pod's envFrom via the chart's top-level `global.extraEnvFrom` knob
# (templates/lib/containerEnv.tpl emits envFrom on all 8 microservices: distributor/
# ingester/querier/query-frontend/query-scheduler/store-gateway/compactor/ruler —
# verified rendered: envFrom referencing mimir-runtime-config + mimir-runtime-secret on
# each). Every required.* key below maps to a real ${VAR} reference in the rendered
# mimir config ConfigMap (templates/mimir-config.yaml):
#   common.storage.s3 uses ${S3_ENDPOINT}, ${S3_REGION}, ${S3_ACCESS_KEY_ID},
#   ${S3_SECRET_ACCESS_KEY}, ${S3_INSECURE}; blocks_storage.s3.bucket_name uses
#   ${S3_BUCKET_BLOCKS}; ruler_storage.s3.bucket_name uses ${S3_BUCKET_RULER}.
freeze_line:
  # The signed pre-rendered manifest is the workload DEFAULT (Deployments/StatefulSets +
  # Services + RBAC + config ConfigMap + Namespace), published as a native-OCI Kustomize
  # base (kustomization.yaml + manifest.yaml, `task package` per apps#508) — consumers
  # attach per-cluster overlays via `source.kustomize.patches`. Calibrated-friction
  # (ADR-0024): the base itself restricts nothing; the image digest is pinned at admission
  # (cosign) and dangerous classes are fenced by the consumer-side ADR-0018 Kyverno
  # safe-defaults — never a catalog allowlist here.
  workload: rendered/manifest.yaml
provided_refs:
  env: mimir-runtime-config # Shape (a): non-secret S3 connection scalars via envFrom
  secret: mimir-runtime-secret # Shape (c): S3 credentials via envFrom
provided_selectors: {} # no operator-assembled config / consumer-labeled CRs
required:
  env_keys: # Shape (a) — set in the mimir-runtime-config ConfigMap; expanded into the mimir config at runtime
    # HOST:PORT, NOT a URL — mimir's S3 client is thanos-io/objstore, which rejects a
    # scheme outright ("Endpoint url cannot have fully qualified paths"), and the affected
    # mimir processes then fail to start on the usage-stats bucket client. http vs https is
    # selected by S3_INSECURE below, never by this value. The form is NOT uniform across
    # the catalog and must not be copied between components — all three were deployed
    # against a local S3 backend to establish this: loki-distributed comes up with an
    # `http://` prefix (its client accepts a URL), tempo-distributed fails exactly as mimir
    # does ("failed to create minio client: Endpoint url cannot have fully qualified
    # paths"). The tempo components still document the URL form and are wrong; correcting
    # them is their own change, since a PR touches one component.
    - S3_ENDPOINT # e.g. garage.<namespace>.svc.cluster.local:3900
    - S3_REGION # S3 region (the platform's Garage impl uses `garage`)
    - S3_BUCKET_BLOCKS # bucket for Mimir TSDB blocks
    - S3_BUCKET_RULER # bucket for the Mimir ruler
    - S3_INSECURE # S3 endpoint TLS mode: "false"=TLS/HTTPS (default, secure), "true"=plain HTTP (a TLS-less S3 endpoint)
  config_files: [] # no Shape (b) whole-file config — the mimir config is catalog-rendered, only ${VAR}s are consumer-fed
  secret_keys: # Shape (c) — set in the mimir-runtime-secret Secret
    - S3_ACCESS_KEY_ID # S3 access key id
    - S3_SECRET_ACCESS_KEY # S3 secret access key
  selector_crs: []
# Consumer-settable knobs that are NOT mandatory: the rendered config carries a working
# default for each, so a consumer who sets nothing gets the shipped single-node behaviour
# unchanged (#794). All of them resolve through the SAME mimir-runtime-config ConfigMap as
# required.env_keys above, via -config.expand-env=true. Every key here corresponds to a
# ${KEY:default} placeholder in helm/mimir.yaml; the README documents the invariants and
# the ordering rules that the contract cannot express.
optional:
  env_keys:
    # --- ring replication (see README § Scaling out) ---
    - name: INGESTER_REPLICATION_FACTOR
      description: >-
        ingester.ring.replication_factor. Raise ONLY after the ingester replica count is
        at least as high — the reverse leaves fewer live ring instances than the factor
        demands, and every write and query fails. Use 1 or 3; an even factor raises the
        quorum without adding failure tolerance. Not retroactive: it applies to samples
        received from then on, never to data already written.
      default: "1"
    - name: STORE_GATEWAY_REPLICATION_FACTOR
      description: >-
        store_gateway.sharding_ring.replication_factor. Same ordering rule as the ingester
        factor, against the store-gateway's OWN ring — wait for those replicas to register
        before raising it. Never scale the store-gateway below this value.
      default: "1"
    # --- query-path caches: the catalog ships no memcached, the consumer brings one ---
    - name: CHUNKS_CACHE_BACKEND
      description: >-
        blocks_storage.bucket_store.chunks_cache.backend. Empty means no chunks cache.
        Set to `memcached` together with CHUNKS_CACHE_ADDRESSES.
      default: ""
      group: chunks-cache
    - name: CHUNKS_CACHE_ADDRESSES
      description: >-
        blocks_storage.bucket_store.chunks_cache.memcached.addresses (dns+host:port).
        A memcached backend with an empty address list fails loudly at startup; a wrong
        but resolvable address degrades silently.
      default: ""
      group: chunks-cache
    - name: INDEX_CACHE_BACKEND
      description: >-
        blocks_storage.bucket_store.index_cache.backend. Mimir's own default is `inmemory`,
        NOT empty — and because the fallback also fires on an empty value, setting this to
        "" yields `inmemory` again. Disabling the index cache is not reachable through
        this knob.
      default: inmemory
      group: index-cache
    - name: INDEX_CACHE_ADDRESSES
      description: >-
        blocks_storage.bucket_store.index_cache.memcached.addresses. Only consulted when
        INDEX_CACHE_BACKEND is memcached.
      default: ""
      group: index-cache
    - name: METADATA_CACHE_BACKEND
      description: >-
        blocks_storage.bucket_store.metadata_cache.backend. Empty means no metadata cache.
      default: ""
      group: metadata-cache
    - name: METADATA_CACHE_ADDRESSES
      description: >-
        blocks_storage.bucket_store.metadata_cache.memcached.addresses.
      default: ""
      group: metadata-cache
    - name: RESULTS_CACHE_BACKEND
      description: >-
        frontend.results_cache.backend. Empty means no results cache.
      default: ""
      group: results-cache
    - name: RESULTS_CACHE_ADDRESSES
      description: >-
        frontend.results_cache.memcached.addresses.
      default: ""
      group: results-cache
    - name: RESULTS_CACHE_ENABLED
      description: >-
        frontend.cache_results. A separate switch from the backend: setting only backend
        and addresses yields a configured but INERT results cache with no error, which is
        why all three keys form one group. Boolean as a string ("true"/"false").
      default: "false"
      group: results-cache
    # --- ruler notification target ---
    - name: RULER_ALERTMANAGER_URL
      description: >-
        ruler.alertmanager_url — the consumer's standalone Alertmanager (the bundled one is
        disabled). Unset means the ruler evaluates rules but notifies nobody, which is a
        valid state, so this is optional rather than required (see #448).
      default: ""
sync_wave: "10" # needs the cluster's S3 endpoint + buckets to exist first (s3-object capability)
external_dependencies: [] # the S3 object store is a deploy-time dep (compatibility.yaml `requires: s3-object`), not a build dep
