# Customization Contract v2 (ADR-0024). The rendered workload is a self-contained,
# cluster-agnostic Vault server (standalone, file storage, plaintext listener, Shamir
# seal): the chart template fully configures the StatefulSet from the baseline values,
# so the consumer supplies NOTHING for the baseline to reach the sealed-but-operational
# state. Every `required` shape is therefore empty and there are no `provided_refs`/
# `provided_selectors`.
#
# Deliberately NOT modelled here (consumer/Layer-3 render-time concerns, ADR-0024):
#   - a TLS listener (requires re-rendering with `global.tlsDisable: false` — the
#     scheme/addr/port-names are baked in at helm-render time, so a Kustomize patch on
#     the pre-rendered base cannot enable TLS; see README §TLS + the risks in #827),
#   - a non-Shamir seal (cloud KMS / transit — render-time `server.seal.*` values),
#   - HA/Raft topology, an audit device, the StorageClass override.
# The only runtime interaction is `vault operator init` + `vault operator unseal` —
# CLI operations, not Kubernetes resources the catalog models.
#
# This workload lands at wave 0; it has no catalog-internal predecessor.
freeze_line:
  workload: rendered/manifest.yaml
provided_refs: {} # no consumer-supplied env/config/secret refs
provided_selectors: {} # no consumer-labeled CRs
required:
  env_keys: []
  config_files: []
  secret_keys: []
  selector_crs: []
sync_wave: "0"
external_dependencies: []
