# The component's own namespace. vault-server is the sole occupant (dedicated
# namespace), so this component ships the Namespace object — a shipped manifest takes
# precedence over Argo `managedNamespaceMetadata`, making the PSA posture authoritative
# and self-contained (build skill CONVENTIONS § Namespace & PSA; talos-platform-docs
# ADR-0027).
#
# enforce: restricted — the Vault server StatefulSet runs fully restricted-compliant.
# Confirmed against the rendered manifest: the pod sets securityContext runAsNonRoot:true
# + runAsUser:100 + runAsGroup:1000 + fsGroup:1000 + seccompProfile RuntimeDefault, and
# the vault container sets allowPrivilegeEscalation:false + capabilities.drop:[ALL]
# (all pinned in helm/vault-server.yaml — the chart helpers render securityContext
# verbatim, not merged). The standalone StatefulSet uses no hostPath/host-namespace/
# host-port/privileged field; IPC_LOCK is absent (the chart dropped it since swap is
# disabled on containers, so disable_mlock=true is auto-injected).
#
# The consumer adds — per ADR-0027 — the PNI labels and the
# pod-security.kubernetes.io/enforce-version pin (its cluster minor) in its Argo overlay;
# the catalog ships neither (consumer-composition concerns).
apiVersion: v1
kind: Namespace
metadata:
  name: vault-server
  labels:
    pod-security.kubernetes.io/enforce: restricted
    platform.devoba.de/sub-layer: secrets
    platform.devoba.de/component: vault-server
