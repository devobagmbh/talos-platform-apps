metadata:
  chart: vault
  repo: https://helm.releases.hashicorp.com
  version: 0.34.1
  namespace: vault-server

values:
  global:
    # -- Plaintext listener. Render-time only: the chart bakes VAULT_ADDR, the port
    # names and the probe scheme into the StatefulSet, so a consumer patch cannot enable TLS.
    tlsDisable: true

  injector:
    # -- The chart default "-" inherits global.enabled (on); false keeps the injector and its
    # MutatingWebhookConfiguration out.
    enabled: false

  server:
    image:
      tag: "2.0.4"

    authDelegator:
      enabled: false

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: null
      mountPath: /vault/data
      accessMode: ReadWriteOnce

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

    statefulSet:
      # -- Rendered verbatim, not merged with the chart defaults: list every field PSA
      # `restricted` requires.
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          # readOnlyRootFilesystem stays unset: the entrypoint writes
          # /tmp/storageconfig.hcl and $HOME.
