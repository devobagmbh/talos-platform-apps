# Official HashiCorp Vault server (standalone) — Layer-2 default values for
# talos-platform-apps. This component wraps the upstream `hashicorp/vault` chart to
# provide a self-managed Vault *instance* under **human-custody manual unseal**,
# complementary to the operator-managed `secrets/vault-operator` path (bank-vaults,
# which auto-unseals). It renders a single-replica standalone StatefulSet with file
# storage on a persistent volume; the operator runs `vault operator init` +
# `vault operator unseal` by hand (key shares distributed offline — see README).
#
# Cluster-specific bits (StorageClass, HA/Raft, a TLS listener, a non-Shamir seal,
# an audit device) are consumer concerns (Layer 3) — see README + customization.yaml.
#
# `kind: mixed`: the chart renders the StatefulSet/Services/RBAC/ConfigMap/
# ServiceAccount; `manifests/00-namespace.yaml` ships the dedicated Namespace (the
# chart has no Namespace template).
metadata:
  chart: vault
  repo: https://helm.releases.hashicorp.com
  version: 0.34.1 # appVersion 2.0.4; verified 2026-08-21 (helm search repo hashicorp/vault). VERIFY at push.
  namespace: vault-server

values:
  global:
    # -- Baseline renders a PLAINTEXT listener (tls_disable=1). TLS is a RENDER-TIME
    # decision: `global.tlsDisable` drives the `vault.scheme` helper, which hard-codes
    # VAULT_ADDR/port-names/probe scheme into the signed StatefulSet — a consumer
    # Kustomize patch CANNOT enable TLS. See README (§TLS) + customization.yaml.
    tlsDisable: true

  # -- Suppress the Vault Agent Injector Deployment + its MutatingWebhookConfiguration.
  # The chart default `injector.enabled: "-"` inherits `global.enabled: true` (on).
  # The catalog baseline is the server only; a consumer needing the injector ships it
  # as a supplemental Argo Application.
  injector:
    enabled: false

  server:
    image:
      # -- Explicit tag pin (chart default is already 2.0.4 for chart 0.34.1); no :latest.
      tag: "2.0.4"

    # -- Suppress the `system:auth-delegator` ClusterRoleBinding (chart default true).
    # It grants cluster-wide TokenReview/SubjectAccessReview, needed only for the
    # Kubernetes auth method, which the human-custody standalone baseline does not use.
    authDelegator:
      enabled: false

    # -- Durable PVC-backed storage. `enabled: true` is the chart default, pinned
    # explicitly to make the persistent intent unambiguous: the StatefulSet gets a
    # `volumeClaimTemplate` (NOT an emptyDir — an emptyDir would lose all sealed data
    # on every pod restart and invalidate the distributed unseal shares).
    # storageClass stays null → the cluster's DEFAULT StorageClass (a consumer
    # precondition; overlay `server.dataStorage.storageClass` if none — see README).
    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: null
      mountPath: /vault/data
      accessMode: ReadWriteOnce

    # -- Explicit requests+limits (chart default is {}) for the conftest resource-limit
    # gate. Memory limit is set ABOVE the chart's commented 256Mi example for headroom:
    # an OOM-kill re-seals a running Vault and forces a manual re-unseal (a human
    # incident), so the sealed/unsealed process gets room. Verify against observed use.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

    # -- PSA `restricted` compliance. The chart's securityContext helpers are if/else,
    # NOT merge: setting `pod`/`container` renders the given YAML VERBATIM, so every
    # field required for restricted must be listed. The non-OpenShift server-container
    # default emits only `allowPrivilegeEscalation: false` (no drop:[ALL], no
    # seccompProfile), so both are pinned here.
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
