# block-storage-* is not `instanced: true`, so no capability pin fits; the PVC only needs
# the cluster's default StorageClass.
requires: {}

# Second active `vault-secrets` implementation beside secrets/vault-operator: the same
# Vault HTTP API, so not a topology variant.
provides:
  - name: vault-server
    version:
      sot: app
      app: "2.0.4"
      chart: "0.34.1"
    api_surface: []
    capabilities:
      - {id: vault-secrets, swap_class: data-migration}
