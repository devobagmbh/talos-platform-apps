# vault-server ships the official HashiCorp Vault chart as a self-managed Vault
# instance. It renders 0 CustomResourceDefinitions (the chart ships none), so there is
# no strict-B `-crds` split and no `crd-bearing` marker.
requires: {}
# No catalog-internal dependency. The StatefulSet claims a PVC from the cluster's
# DEFAULT StorageClass — a consumer cluster precondition, not a catalog dep. A concrete
# `block-storage-*` capability-id pin would be semantically wrong: those ids are not
# `instanced: true`, and per catalog/README.md a `requires:` capability names a
# swappable interface, not a per-cluster PVC precondition. `requires: {}` is the
# established catalog convention for a component whose only storage need is the default
# StorageClass.

# Provides the swappable operational capability `vault-secrets` — an in-cluster Vault
# instance exposing the KV secret-access API. This is a SECOND active implementation of
# that capability alongside `secrets/vault-operator` (bank-vaults): different upstream
# chart, different management model (direct StatefulSet vs. CR-reconciled), NOT a
# topology variant and NOT mutually exclusive (a cluster may run both). From a consumer's
# view both expose the SAME swappable interface — an in-cluster Vault HTTP API for KV
# secret access — which is exactly what `vault-secrets` (`instanced: true`) names; two
# `active` implementations of one instanced capability is therefore correct, not a
# contract violation (the interface is swappable, not "multiple instances of one tool").
# swap_class `data-migration` matches the active implementation and the index entry
# (swapping implementations means migrating the stored secret data). The chart exposes no
# CRD/API surface, so api_surface is empty.
provides:
  - name: vault-server
    version:
      sot: app
      app: "2.0.4" # Vault appVersion; no `v` prefix — lint:version matches the image tag `hashicorp/vault:2.0.4`
      chart: "0.34.1"
    api_surface: []
    capabilities:
      - {id: vault-secrets, swap_class: data-migration}
